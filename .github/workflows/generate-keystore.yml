name: Generate keystore (run once)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias mukhatat \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Mukhatat, OU=App, O=Mukhatat, L=Cairo, C=EG"
          base64 -w 0 release.keystore > keystore.b64
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_PASSWORD=$PASS"
            echo "KEY_ALIAS=mukhatat"
            echo "KEYSTORE_BASE64=(the content of keystore.b64 file)"
          } > secrets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets-DELETE-AFTER-USE
          path: |
            keystore.b64
            secrets.txt
            release.keystore
          retention-days: 1
